services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d corre los .sql en orden alfabético SOLO en
      # la primera inicialización (volumen vacío): schema → seed → pgvector.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/migrations/002_pgvector.sql:/docker-entrypoint-initdb.d/03_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: