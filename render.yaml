# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Deploy: Dashboard -> New -> Blueprint Instance -> connect this repo.
# Render builds ./Dockerfile for the API and prompts once for the secrets
# (AGRO_DATABASE_URL, GEMINI_API_KEY, JWT_SECRET, GROQ_API_KEY).
#
# WHY NO `databases:` SECTION — read before deploying:
# Render allows only ONE free-tier Postgres per account ("cannot have more than
# one active free tier database"). To keep this deploy free and decoupled from
# the hosting provider, the Postgres lives OUTSIDE Render on Neon
# (serverless Postgres, free tier, pgvector included):
#
#   1. Create a Neon project: https://neon.tech -> New Project -> region near
#      your users (us-east-2 works well for Render oregon/ohio).
#      Copy the "connection string" (pooled or direct; the backend uses pgx,
#      which accepts the full postgresql:// DSN).
#   2. Paste it as the AGRO_DATABASE_URL secret when Render prompts.
#   3. Seed ONCE from your machine against that same DSN:
#
#        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql -f db/seed.sql
#
#      Both files are psql -f compatible (no \connect, no DO blocks). schema.sql
#      requires the pgvector extension, which Neon supports natively
#      (CREATE EXTENSION vector). seed.sql uses relative dates (CURRENT_DATE)
#      but is NOT idempotent (fixed demo ids) — run it exactly once.
#
# After the seed the API runs standalone; re-running it on a populated database
# fails the inserts (ON_ERROR_STOP=1).

services:
  - type: web
    runtime: docker       # replaces the deprecated `env: docker`
    name: agro-agent-api
    plan: free            # free tier sleeps after inactivity -> slow cold
                          # starts; use `starter` for anything resembling
                          # real use
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz   # GET /healthz is public, returns 200 "ok"
    envVars:
      # Secrets: Render prompts for a value during Blueprint creation; they
      # are never stored in this file.
      # Postgres DSN from Neon (https://neon.tech). cmd/api/main.go reads
      # AGRO_DATABASE_URL (pgx DSN). Not fromDatabase: the DB is external.
      - key: AGRO_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false       # primary chat provider + embeddings; only required if
                          # GROQ_API_KEY is unset (cmd/api/main.go needs at least one)
      - key: JWT_SECRET
        sync: false       # required by cmd/api/main.go; the value "change-me"
                          # is rejected at startup
      # Optional failover provider: if GEMINI_API_KEY 429s (free-tier quota),
      # the chat falls back to Groq automatically. Without this key the system
      # runs on Gemini alone. GROQ_MODEL is optional (default llama-3.3-70b-versatile).
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      # Render injects PORT automatically for web services; pinning it here
      # just makes the value explicit. cmd/api/main.go defaults to 8080.
      - key: PORT
        value: "8080"
      # Optional: per-IP chat rate limit (requests/minute). Code default: 10.
      - key: CHAT_RATE_LIMIT
        value: "10"
